# JavaScript in this repository: ES modules (*.mjs), no TypeScript and no
# tsconfig. Contract and schema:
# https://github.com/melodic-software/claude-code-plugins/tree/main/docs/contracts/ecosystem-commands
# The test is CI's validate-marketplace job: npm test, then npm run validate
# (.github/workflows/pr-require-checks.yml:74-91; the scripts are
# package.json:11-12). CI lints no JavaScript and builds none. Commands run
# from the repository root.
enabled: true
globs: ["*.mjs", "package.json"]
project-discovery: []
build-cmd: null
test-cmd: "npm test && npm run validate"
check-cmd: null
fix-cmd: null
code-fix-cmd: null
install-hint: "node 24 (.node-version, which CI's setup-node reads: pr-require-checks.yml:84-87). package.json declares no dependencies, so there is nothing to install. The Python-backed tests need python, python3 or py -3 on PATH."
tool-pin:
  node: "24"
gates: []
notes: "Pin: .node-version:1 names the major only. .node-version is a standards-synced file (pr-check-managed-files-hosted.yml:73), so a sync can change it and leave this pin behind. The two CI steps run in order with no continue-on-error, so CI stops at the first failure (pr-require-checks.yml:88-91); test-cmd chains them with && for the same reason. node --test exits 0 when a test is skipped; read its skipped count. The tests that run the bundled Python scripts skip when no Python launcher answers --version (tests/helpers.mjs:109-125; tests/codex-changelog.test.mjs:22-23, tests/codex-operations.test.mjs:21-22), and the symlink and POSIX-shim tests skip on Windows (plugins/plugin-ops/skills/verify-plugin/scripts/validate-marketplace.test.mjs:661; tests/codex-changelog.test.mjs:229). A local run reads the working tree: npm run validate lists directories with readdir, not git (validate-marketplace.mjs:109-111), so an untracked file under a plugin can raise a finding CI's clean checkout does not. These tests also exercise the *.py scripts; python.yaml runs no command of its own. Glob gaps: CI's validate-marketplace job has no path filter (pr-require-checks.yml:76), so CI runs these tests on every change; these globs select only *.mjs and package.json, so a change to any other file runs no local test, for example a SKILL.md, a plugin.json, .agents/plugins/marketplace.json, a *.py script, a test fixture, .node-version, a plugin's agents/openai.yaml (tests/helpers.mjs:39), or docs/*.md, AGENTS.md and README.md (tests/documentation-contract.test.mjs:33, :49, :103)."
