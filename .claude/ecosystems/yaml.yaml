# GitHub Actions workflows and Dependabot config in this repository. Contract
# and schema:
# https://github.com/melodic-software/claude-code-plugins/tree/main/docs/contracts/ecosystem-commands
# CI lints no workflow: .github/workflows/pr-require-checks.yml has no
# actionlint, schema or zizmor step (:73-153). So this record runs no command.
enabled: true
globs: [".github/**/*.yml", ".github/**/*.yaml"]
project-discovery: []
build-cmd: null
test-cmd: null
check-cmd: null
fix-cmd: null
code-fix-cmd: null
install-hint: "None: this record runs no command."
tool-pin: {}
gates: []
notes: "No command because CI has none for workflow lint. Without this file the bundled yaml default (claude-code-plugins plugins/toolchain/reference/ecosystems/yaml.yaml:8-9) would run actionlint, because its opt-in, GitHub Actions workflows present, is met. The record is enabled: true with null commands rather than enabled: false: the repository holds workflows, null commands read as not applicable, and false would also drop the lane for code-metrics, which reads enabled (the ecosystem-commands contract README, Consumers). No opt-in key: there is no check-cmd for it to govern. The workflows' CI-only checks are listed in cross-cutting.yaml's notes. The plugins' agents/openai.yaml sidecars are outside these globs; CI's node tests read them (tests/helpers.mjs:39) on every change, and a change to only a sidecar runs no local test (typescript.yaml notes that glob gap)."
