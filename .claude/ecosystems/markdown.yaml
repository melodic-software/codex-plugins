# Markdown in this repository: READMEs, docs, rules and skill bodies. Contract
# and schema:
# https://github.com/melodic-software/claude-code-plugins/tree/main/docs/contracts/ecosystem-commands
# CI runs no markdown linter: .github/workflows/pr-require-checks.yml has no
# markdownlint step (:73-153). Its only markdown check is the offline link
# check, which runs from cross-cutting.yaml. So this record runs no command.
enabled: true
globs: ["*.md"]
project-discovery: []
build-cmd: null
test-cmd: null
check-cmd: null
fix-cmd: null
code-fix-cmd: null
install-hint: "None: this record runs no command."
tool-pin: {}
gates: []
notes: "No command because CI has none for markdown lint. Without this file the bundled markdown default (claude-code-plugins plugins/toolchain/reference/ecosystems/markdown.yaml:7) would run markdownlint-cli2 on changed *.md files, because its opt-in, a markdownlint config, is met by .markdownlint-cli2.jsonc; that file is standards-synced (pr-check-managed-files-hosted.yml:72) and no CI job here reads it. The record is enabled: true with null commands rather than enabled: false: the repository holds markdown, null commands read as not applicable, and false would also drop the lane for code-metrics, which reads enabled (the ecosystem-commands contract README, Consumers). No opt-in key: there is no check-cmd for it to govern. CI's node tests read some markdown (SKILL.md bodies and docs/, for example tests/documentation-contract.test.mjs:143); a change to only a *.md file runs those tests in CI but not here (typescript.yaml notes that glob gap)."
