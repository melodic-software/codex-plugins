notes: "No command because CI has none for shell. Without this file the bundled bash default (claude-code-plugins plugins/toolchain/reference/ecosystems/bash.yaml:7) would run shellcheck and shfmt on a changed shell file: its opt-in says shellcheck always applies to shell files and shfmt applies when .editorconfig declares shell style (:9), which this repository's .editorconfig does (.editorconfig:46-48). The record is enabled: true with null commands rather than enabled: false: the repository holds a shell script, null commands read as not applicable, and false would also drop the lane for code-metrics, which reads enabled (the ecosystem-commands contract README, Consumers). No opt-in key: there is no check-cmd for it to govern. The script's source of truth is melodic-software/standards; check-managed-files, advisory here, fails a pull request that hand-edits it (pr-check-managed-files-hosted.yml:11-22)."
