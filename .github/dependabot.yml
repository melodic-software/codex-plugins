# Dependabot keeps this repository's SHA-pinned GitHub Actions current with
# REVIEWED pull requests: GitHub-native, no third-party app and no token. Only
# the `github-actions` ecosystem is configured, because the repository's Node
# tooling has no lockfile and no runtime dependencies to track.
#
# Merge lanes follow the standards dependabot-policy component: the
# `first-party-actions` group (the melodic-software/ci-workflows composite
# action pins) and the `vendor-actions` group (non-major only) are the
# auto-merge lanes armed by pr-automerge-dependabot.yml; every other PR is
# in the review tier and runs `pr-require-checks` before it merges. A
# dependency joins the first group that matches it: a vendor major falls
# through to the reviewed `github-actions` group, and a first-party major stays
# in `first-party-actions`, where the lane does not arm a pull request that
# holds a major bump, so it takes the review tier.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    # Only the `dependencies` label (already in the governed taxonomy). This
    # overrides Dependabot's defaults, suppressing the auto-created snake_case
    # `github_actions` ecosystem label that every downstream tool ignores.
    labels:
      - dependencies
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
    # Let a brand-new release settle before proposing it (supply-chain caution);
    # security-advisory updates bypass cooldown and still surface immediately.
    cooldown:
      default-days: 3
      # First-party releases take no soak (the synced Dependabot policy's
      # `fastTrack.own`).
      exclude:
        - "melodic-software/ci-workflows/*"
    groups:
      # Every ci-workflows composite-action pin moves in one pull request, so
      # the repository stays on one ci-workflows release.
      first-party-actions:
        patterns:
          - "melodic-software/*"
      vendor-actions:
        patterns:
          - actions/*
          - github/*
          - anthropics/*
        update-types: [minor, patch]
      github-actions:
        patterns:
          - "*"
    # The one first-party pin Dependabot leaves alone sits in the sync-managed
    # pr-check-managed-files-hosted.yml, which the standards sync owns.
    ignore:
      - dependency-name: "melodic-software/ci-workflows/.github/actions/check-managed-files"
