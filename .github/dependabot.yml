# Dependabot keeps this repository's SHA-pinned GitHub Actions current with
# REVIEWED pull requests: GitHub-native, no third-party app and no token. Only
# the `github-actions` ecosystem is configured, because the repository's Node
# tooling has no lockfile and no runtime dependencies to track.
#
# Merge lanes follow the standards dependabot-policy component: the
# `vendor-actions` group (non-major only) is the auto-merge lane armed by
# pr-automerge-dependabot.yml; every other PR is reviewed by hand and runs
# `pr-require-checks` before a human merges it. A dependency joins the first
# group that matches it, so majors fall through to the reviewed `github-actions`
# group.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    # Only the `dependencies` label (already in the governed taxonomy). This
    # overrides Dependabot's defaults, suppressing the auto-created snake_case
    # `github_actions` ecosystem label that every downstream tool ignores.
    labels:
      - dependencies
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
    # Let a brand-new release settle before proposing it (supply-chain caution);
    # security-advisory updates bypass cooldown and still surface immediately.
    cooldown:
      default-days: 3
    groups:
      vendor-actions:
        patterns:
          - actions/*
          - github/*
          - anthropics/*
        update-types: [minor, patch]
      github-actions:
        patterns:
          - "*"
    # Every melodic-software/ci-workflows ref (reusable workflows AND composite
    # actions) moves only through deliberate reviewed PRs per the standards
    # runner-policy selector-revision lockstep, so all of them are ignored here.
    ignore:
      - dependency-name: "melodic-software/ci-workflows/*"
