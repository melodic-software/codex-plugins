# Dependabot keeps this repository's SHA-pinned GitHub Actions current with
# REVIEWED pull requests: GitHub-native, no third-party app and no token. Only
# the `github-actions` ecosystem is configured, because the repository's Node
# tooling has no lockfile and no runtime dependencies to track.
#
# No auto-merge is configured, so every bump is a pull request that runs `ci`
# before a human merges it. Grouping every action into one pull request means a
# ci-workflows release arrives as a single reviewable bump rather than one pull
# request per reference.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    # Only the `dependencies` label (already in the governed taxonomy). This
    # overrides Dependabot's defaults, suppressing the auto-created snake_case
    # `github_actions` ecosystem label that every downstream tool ignores.
    labels:
      - dependencies
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
    # Let a brand-new release settle before proposing it (supply-chain caution);
    # security-advisory updates bypass cooldown and still surface immediately.
    cooldown:
      default-days: 7
      # First-party melodic-software actions skip the supply-chain wait so our
      # own ci-workflows fixes propagate without the cooldown delay.
      exclude:
        - "melodic-software/*"
    groups:
      github-actions:
        patterns:
          - "*"
