name: pr-issue-linkage

# Metadata-only caller for the organization-required issue-linkage check.
# pull_request_target uses the protected base-branch definition; the reusable
# refetches the PR body through the API and does not execute PR-head code.
on:
  # zizmor: ignore[dangerous-triggers] metadata-only gate; rationale above
  pull_request_target:
    types: [opened, edited, reopened, synchronize]
  merge_group:

permissions:
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-issue-linkage:
    # Job-level permissions replace the workflow-level block outright, so both
    # scopes the reusable declares are listed here: pull-requests: read to read
    # the PR body it validates, and actions: read for its
    # cancelled-versus-timed_out prerequisite resolver. A reusable cannot
    # elevate caller permissions, and GitHub rejects it at startup when the
    # caller grants a stricter set — the required context then never
    # materializes at all, rather than reporting red. Standards' runner-policy
    # records the same pair as this ref's `minimumCallerPermissions`.
    permissions:
      pull-requests: read
      actions: read
    uses: melodic-software/ci-workflows/.github/workflows/pr-issue-linkage.yml@7107b34832a7b6db5d08d3b132621c599fbe5e50 # 7107b34 2026-08-13 v0.14.2
    with:
      runner: ubuntu-24.04
