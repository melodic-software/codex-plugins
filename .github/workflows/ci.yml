name: ci

on:
  push:
    branches: [main]
  pull_request:
    # `edited`, `labeled` and `unlabeled` can change the pr-title /
    # do-not-merge / issue-linkage answers without a new commit, so the required
    # check has to re-evaluate. Whether such an event is CONTRACT-ONLY (lanes
    # gated off, ci-status carrying the recorded `ci-lanes` verdict forward) is
    # decided by one predicate, repeated verbatim in `concurrency.group` and in
    # every job's `if:` except `ci-status`:
    #
    #   github.event.pull_request.head.repo.full_name == github.repository &&
    #   (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) ||
    #    (github.event.action == 'edited' && !github.event.changes.base))
    #
    # An `edited` event carrying `changes.base` is a BASE-BRANCH change: the
    # merge commit the lanes test changes with it, so that runs in full. A fork
    # pull request is never contract-only — its token is read-only on
    # `pull_request` whatever `permissions:` requests, so it cannot record lane
    # state — and runs the full workflow on every event exactly as before.
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read

# The concurrency GROUP branches on the contract-only predicate (ci-perf Phase
# 6b); `cancel-in-progress` is a plain `true` because it takes one value per
# workflow and cannot branch.
#
# Contract-only branch: `ci-contract-<pr>-<run_id>`, unique per run. No
# contract-only run can be cancelled, evict anything, or be evicted. That is
# deliberate. Eviction of a *pending* run is unconditional in GitHub's queueing
# ("any existing pending job or workflow in the same concurrency group will be
# canceled") and is NOT governed by `cancel-in-progress`, so the old shared
# group let one contract-only event evict another and leave a check suite on the
# current head with no `ci-status` check run at all, a required check that stops
# reporting until someone re-runs that specific run (dotfiles#647, 2h14m
# silent). Uniqueness costs a burst of one-job runs when labels flip repeatedly,
# seconds each, writing nothing.
#
# Full branch: `<workflow>-<pr number || run_id>` with cancel-in-progress true,
# so a `synchronize` still cancels the run it supersedes. Keying PRs on the
# number (not head_ref) keeps fork PRs that share a branch name from cancelling
# each other's required runs. The fallback term is the per-repository push
# decision: `github.run_id` gives every push its own group and therefore no
# push-side burst collapse, which is this repository's existing behaviour. The
# `github.event_name == 'pull_request'` guard the old `cancel-in-progress`
# carried is gone with it.
#
# The cost of the branch: a contract-only run no longer queues behind the full
# run whose `ci-lanes` status it carries forward, so the two race. The
# `ci-status` composite closes that with a bounded wait on EARLIER incomplete
# runs on the same head SHA; see `carry-forward-wait-seconds` on the job below.
#
# One hazard the branch does not remove, because no concurrency setting both
# removes it and keeps supersession: the full branch is keyed on the pull
# request number, which does not vary with the head SHA, so re-running a STALE
# run on a superseded head SHA lands in the CURRENT head's group and cancels the
# run that is actually reporting. Re-run the run on the current head instead.
# Contract-only runs are immune, being unique per `github.run_id`.
concurrency:
  group: >-
    ${{ (github.event.pull_request.head.repo.full_name == github.repository &&
    (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) ||
    (github.event.action == 'edited' && !github.event.changes.base)))
    && format('ci-contract-{0}-{1}', github.event.pull_request.number, github.run_id)
    || format('{0}-{1}', github.workflow, github.event.pull_request.number || github.run_id) }}
  cancel-in-progress: true

jobs:
  marketplace:
    name: Marketplace contracts
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Run validator tests
        run: npm test
      - name: Validate the marketplace
        run: npm run validate

  ci-status:
    needs: [marketplace]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # pr-contract upserts the advisory linkage comment and moves the linkage
      # label; ci-status records the `ci-lanes` commit status the carry-forward
      # branch reads back on the next contract-only event.
      pull-requests: write
      statuses: write
      # The carry-forward wait enumerates this workflow's runs on this head SHA.
      # Under an explicit `permissions:` block every unlisted scope defaults to
      # none, so without this the Actions reads 403; the composite then warns
      # naming the scope and fails, it never passes.
      actions: read
    steps:
      - name: Check the pull-request contract
        uses: melodic-software/ci-workflows/.github/actions/pr-contract@906ae7ef379ea4d2b8497f64475dce1d3d8715c4 # v0.22.0
        with:
          token: ${{ github.token }}
      - name: Aggregate lane results
        # `!cancelled()` so a failing pr-contract step does not skip the
        # aggregation: the job still fails on the contract step's exit code, and
        # the `ci-lanes` status is on the SHA for the next contract-only run.
        if: ${{ !cancelled() }}
        uses: melodic-software/ci-workflows/.github/actions/ci-status@906ae7ef379ea4d2b8497f64475dce1d3d8715c4 # v0.22.0
        with:
          # At least 60 seconds below this job's `timeout-minutes: 5` (300s), so
          # the fail-closed error is what a contract-only run reports at the
          # ceiling rather than a job timeout preempting it.
          carry-forward-wait-seconds: '240'
          results: ${{ join(needs.*.result, ' ') }}
          # The replaced inline aggregator passed only `success`, so a `skipped`
          # lane was already red here.
          treat-skipped-as: fail
          token: ${{ github.token }}
