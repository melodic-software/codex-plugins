# yaml-language-server: $schema=https://raw.githubusercontent.com/melodic-software/claude-code-plugins/main/plugins/source-control/schemas/source-control.schema.json
# Team layer of the source-control plugin's settings. Keys, values and resolution:
# https://github.com/melodic-software/claude-code-plugins/blob/main/plugins/source-control/reference/config-resolution.md
# Keys not listed here fall through to that resolution order.
#
# pr_body_required_sections must stay in step with the section names the `pr-contract` composite
# reads. It runs as a step inside `ci-status`, the single required check. A body missing `## Fix` or
# `## Verification` by name does not turn that check red; the composite reports it with an advisory
# comment and the `needs-issue-linkage` label. Listing a differently-named equivalent here sends an
# author straight into that advisory noise.
pr_body_required_sections:
  - Summary
  - Fix
  - Verification
  - Related
